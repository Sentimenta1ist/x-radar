<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 420px; margin: 0; font: 13px/1.4 -apple-system, system-ui, sans-serif; color: #0f1419; }
  header { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 14px; margin: 0; }
  #list { max-height: 360px; overflow: auto; }
  .row { padding: 8px 12px; border-bottom: 1px solid #f1f3f4; cursor: pointer; }
  .row:hover { background: #f7f9fa; }
  .top { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  .pill { color: #fff; border-radius: 999px; padding: 1px 7px; font-size: 11px; }
  .hot { background: #e0245e; } .rising { background: #f59e0b; } .normal { background: #536471; }
  .meta { color: #536471; font-size: 12px; }
  .txt { margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer { padding: 8px 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; border-top: 1px solid #e5e7eb; }
  button { font: inherit; padding: 4px 8px; }
  input { width: 56px; font: inherit; }
  .empty { padding: 16px 12px; color: #536471; }
</style>
<header><h1>X Viral Radar</h1><span class="meta" id="count"></span></header>
<div id="list"></div>
<footer>
  <label>hot ≥ <input id="hot" type="number" min="1" max="100"></label>
  <label>τ мин <input id="tau" type="number" min="30" max="600"></label>
  <button id="save">Save</button>
  <button id="csv">Export CSV</button>
  <button id="clear">Clear data</button>
</footer>
<script src="popup.js"></script>
